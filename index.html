  <p class="row"><button id="ok">${reg?'Đăng ký':'Đăng nhập'}</button><button class="g" id="sw">${reg?'Đã có tài khoản? Đăng nhập':'Chưa có tài khoản? Đăng ký'}</button></p>
  <p class="mut">Quên mật khẩu: liên hệ quản trị viên để được cấp mật khẩu mới.</p></div>`);
  $('#sw').onclick=()=>authView(!reg);
  $('#ok').onclick=async()=>{const u=$('#u').value.trim(),p=$('#p').value;

const kick=async()=>{clearInterval(hb);await sb.auth.signOut();me=null;authView();err('Tài khoản đã bị khóa')};
const beat=async()=>{if(!me||document.hidden)return;const{data,error}=await sb.rpc('touch_activity');if(!error&&data)kick()};

async function boot(){
  const{data:{session}}=await sb.auth.getSession();
  if(!session)return authView();
  const{data,error}=await sb.from('profiles').select('*').eq('id',session.user.id).single();
  if(error||!data){await sb.auth.signOut();return authView()}
  me=data;
  if(me.locked)return kick();
  const r=me.role,t=r!=='student',m=r==='moderator'||r==='admin',a=r==='admin';
  nav.innerHTML=`<span class="logo">${LOGO}Mstudyh</span><button class="g" data-v="home">Bài học</button><button class="g" data-v="lb">Xếp hạng</button>${t?'<button class="g" data-v="teach">Soạn bài</button>':''}${m?`<button class="g" data-v="mod">${a?'Quản lý bài học':'Kiểm duyệt'}</button>`:''}${a?'<button class="g" data-v="admin">Tài khoản</button><button class="g" data-v="log">Nhật ký</button>':''}<span class="mut">${esc(me.display_name)} · ${RL[r]}</span><button class="g" id="out">Thoát</button>`;
  $$('[data-v]').forEach(b=>b.onclick=()=>go(b.dataset.v));
  $('#out').onclick=async()=>{clearInterval(hb);await sb.auth.signOut();me=null;location.hash='';authView()};
  clearInterval(hb);hb=setInterval(beat,60000);beat();
  route();
}

/* ===== Học sinh: danh sách, xem bài, làm bài, xếp hạng ===== */
const H={q:'',g:'',tag:'',p:0};
async function home(){
  let q=sb.from('lessons').select('id,title,description,subject,grade,tags,featured,published_at,public_updated_at',{count:'exact'}).eq('status','published').is('deleted_at',null);
  const s=clean(H.q);
  if(s)q=q.or(`title.ilike.%${s}%,subject.ilike.%${s}%,category.ilike.%${s}%`);
  if(H.g)q=q.eq('grade',H.g);if(H.tag)q=q.contains('tags',[H.tag]);
  const{data,count}=await X(q.order('featured',{ascending:false}).order('public_updated_at',{ascending:false}).range(H.p*PS,H.p*PS+PS-1));
  show(`<h2>Bài học</h2><div class="row"><input id="q" placeholder="Tìm theo tên, môn, danh mục" value="${esc(H.q)}"><input id="g" placeholder="Lớp" size="5" value="${esc(H.g)}"><button id="sq">Tìm</button>${H.tag?`<button class="g" id="ct">Thẻ: ${esc(H.tag)} ✕</button>`:''}</div>
  ${data.map(l=>`<div class="card"><b>${l.featured?'★ ':''}${esc(l.title)}</b> <span class="mut">${esc(l.subject)} ${esc(l.grade)} · ${pubDate(l)}</span>${l.description?`<p class="mut">${esc(l.description)}</p>`:''}
  <p class="row">${(l.tags||[]).map(t=>`<button class="g chip" data-t="${esc(t)}">#${esc(t)}</button>`).join('')}<button data-o="${l.id}">Xem bài</button><button class="g" data-p="${l.id}">Luyện tập</button></p></div>`).join('')||'<p class="mut">Không có bài học phù hợp.</p>'}${pager(count,H.p)}`);
  const f=()=>{H.q=$('#q').value;H.g=$('#g').value.trim();H.p=0;run(home)};
  $('#sq').onclick=f;$('#q').onkeydown=e=>e.key==='Enter'&&f();
  if(H.tag)$('#ct').onclick=()=>{H.tag='';H.p=0;run(home)};
  $$('[data-t]').forEach(b=>b.onclick=()=>{H.tag=b.dataset.t;H.p=0;run(home)});
  $$('[data-o]').forEach(b=>b.onclick=()=>run(lesson,+b.dataset.o,home));
  $$('[data-p]').forEach(b=>b.onclick=()=>run(practice,+b.dataset.p));
  bindPg(H,home);
}

/* Lần đầu = chính thức (không hiện đáp án từng câu, tính xếp hạng). Từ lần sau = luyện tập (hiện đáp án, không tính điểm). */
async function practice(lid){
  const[{data:qs},{data:at}]=await Promise.all([X(sb.from('questions').select('id,content,type,options').eq('lesson_id',lid).order('id')),X(sb.from('attempts').select('id').eq('lesson_id',lid).eq('is_official',true).limit(1))]);
  if(!qs.length)throw Error('Bài này chưa có câu hỏi');
  const off=!at.length,Q=shuffle(qs).map(q=>({...q,options:shuffle(q.options||[])})),ans={},t0=Date.now();let i=0;
  const txt=(q,a)=>q.type==='short_answer'?a.join(' / '):q.options.filter(o=>a.map(String).includes(String(o.id))).map(o=>o.text).join(' / ');
  const finish=async()=>{
    const{data:r}=await X(sb.rpc('submit_attempt',{lid,ans,secs:Math.round((Date.now()-t0)/1000)}));
    const rv=Object.fromEntries(r.review.map(x=>[x.id,x]));
    show(`<div class="card"><h2>Kết quả: ${r.score} điểm</h2><p>Đúng ${r.correct}/${r.total} câu. ${r.official?'Đây là lần làm chính thức, đã tính vào xếp hạng.':'Lần luyện tập, không tính điểm xếp hạng.'}</p>
    ${r.official?Q.map((q,k)=>{const v=rv[q.id]||{};return `<p><b>Câu ${k+1}: ${v.correct?'Đúng':'Sai'}.</b> ${esc(q.content)}${v.correct?'':`<br><span class="mut">Đáp án: ${esc(txt(q,v.answers||[]))}</span>`}${v.explanation?`<br><span class="mut">${esc(v.explanation)}</span>`:''}</p>`}).join(''):''}
    <button id="bk">Về danh sách bài học</button></div>`);
    $('#bk').onclick=()=>run(home);
  };
  const step=()=>{
    if(i>=Q.length)return finish();
    const q=Q[i],sa=q.type==='short_answer',multi=q.type==='multiple_choice',last=i+1>=Q.length;
    show(`<div class="card"><p class="mut">${off?'Làm chính thức (một lần, tính xếp hạng)':'Luyện tập (không tính xếp hạng)'} · Câu ${i+1}/${Q.length}${multi?' · chọn nhiều đáp án':''}</p><h3>${esc(q.content)}</h3>
    ${sa?'<input id="sa" maxlength="200" placeholder="Nhập câu trả lời" style="width:100%">':`<div>${q.options.map(o=>`<button class="opt" data-id="${esc(o.id)}">${esc(o.text)}</button>`).join('')}</div>`}<p id="fb"></p><button id="ck">${off?(last?'Nộp bài':'Câu tiếp theo'):'Trả lời'}</button></div>`);
    $$('.opt').forEach(b=>b.onclick=()=>{if(b.disabled)return;
      if(multi)b.classList.toggle('sel');else{$$('.opt').forEach(x=>x.classList.remove('sel'));b.classList.add('sel')}});
    $('#ck').onclick=async e=>{
      const chosen=sa?[$('#sa').value.trim()].filter(Boolean):[...$$('.opt.sel')].map(b=>b.dataset.id);if(!chosen.length)return;
      ans[q.id]=chosen;
      if(off){i++;return step()}
      const bt=e.target;bt.disabled=true;
      const{data:r,error}=await sb.rpc('check_answer',{qid:q.id,chosen});if(error){bt.disabled=false;return err(error)}
      const right=r.answers.map(String);
      if(sa)$('#sa').disabled=true;else $$('.opt').forEach(b=>{b.disabled=true;if(right.includes(b.dataset.id))b.classList.add('ok');else if(chosen.includes(b.dataset.id))b.classList.add('no')});
      $('#fb').innerHTML=`${r.correct?'Đúng.':'Sai.'}${sa&&!r.correct?' Đáp án: '+esc(right.join(' / ')):''} ${esc(r.explanation||'')}`;mj();
      bt.disabled=false;bt.textContent=last?'Nộp bài':'Câu tiếp theo';bt.onclick=()=>{i++;step()};
    };
  };
  step();
}

async function lb(){
  const{data}=await X(sb.rpc('leaderboard',{}));

}

let D=null;
const blank=()=>({lid:null,title:'',desc:'',subject:'',grade:'',cat:'',tags:'',c:'',status:'draft',note:'',qs:[],del:[]});
const newQ=k=>({id:null,type:k==='m'?'multiple_choice':k==='sa'?'short_answer':'single_choice',content:'',explanation:'',correct:[],options:k==='sa'?[]:(k==='tf'?['Đúng','Sai']:['','','','']).map((t,i)=>({id:L[i],text:t}))});
const nextId=q=>[...L].find(c=>!q.options.some(o=>o.id===c))||'o'+Date.now();
const qErr=q=>!q.content.trim()?'Thiếu nội dung câu hỏi.':q.type==='short_answer'?(q.correct.length?'':'Chưa nhập đáp án chuẩn.'):q.options.some(o=>!o.text.trim())?'Có phương án còn trống.':!q.correct.length?'Chưa chọn đáp án đúng.':q.type==='single_choice'&&q.correct.length>1?'Dạng một đáp án chỉ được một đáp án đúng.':'';
const keep=()=>{try{localStorage.setItem(DK,JSON.stringify(D))}catch{}};
const b2t=c=>(c||[]).map(b=>b.type==='heading'?'# '+b.data:b.type==='image'?'img:'+b.url:b.type==='audio'?'audio:'+b.url:b.type==='formula'?'$$'+b.data+'$$':b.data).join('\n');
const t2b=t=>t.split('\n').map(x=>x.trim()).filter(Boolean).map(x=>x.startsWith('#')?{type:'heading',data:x.replace(/^#+\s*/,'')}
  :x.startsWith('img:')?{type:'image',url:x.slice(4).trim()}:x.startsWith('audio:')?{type:'audio',url:x.slice(6).trim()}
  :x.startsWith('$$')?{type:'formula',data:x.replace(/^\$\$|\$\$$/g,'')}:{type:'text',data:x});

async function teach(){
  D=null;
  const{data:ls}=await X(sb.from('lessons').select('id,title,subject,grade,status,review_note').eq('teacher_id',me.id).is('deleted_at',null).order('id',{ascending:false}).limit(50));

function parseMex(src){
  const E=[],H={},Q=[],HK=['BÀI','MÔN','LỚP','THỜI_GIAN','MÔ_TẢ'],KEYS=[...HK,'DẠNG','ĐIỂM','ĐỘ_KHÓ','HỎI','ĐÚNG','GIẢI_THÍCH'];
  let q=null,f=null;
  src.normalize('NFC').replace(/^\uFEFF/,'').split(/\r?\n/).forEach((raw,n)=>{
    const ln=n+1,s=raw.trim();
    if(/^===\s*CÂU\s*===$/i.test(s)){q={ln,F:{},O:[]};Q.push(q);f=null;return}
    const m=s.match(/^([A-ZÀ-Ỹ_]+):\s*(.*)$/);
    if(m&&KEYS.includes(m[1])){
      const k=m[1],h=HK.includes(k),T=q?q.F:H;
      if(h===!!q){E.push(`Dòng ${ln} — ${k}: ${h?'thông tin chung phải đặt trước dòng === CÂU ===':'phải nằm trong một khối bắt đầu bằng === CÂU ==='}.`);f=null}
      else{if(T[k])E.push(`Dòng ${ln} — ${k} bị khai báo lặp lại.`);f=T[k]={v:m[2],ln}}
      return}
    const o=q&&(f===q.F['HỎI']||q.O.includes(f))&&s.match(/^([A-Za-z])[.)]\s*(.*)$/);
    if(o){q.O.push(f={k:o[1].toLowerCase(),v:o[2],ln});return}
    if(f)f.v+='\n'+raw;else if(s)E.push(`Dòng ${ln} — Dòng này chưa thuộc trường nào. Hãy bắt đầu bằng một từ khóa như HỎI: hoặc ĐÚNG:.`);
  });
  const v=(F,k)=>(F[k]?.v||'').trim();
  if(!v(H,'BÀI'))E.push('Thiếu dòng BÀI: (tên bài tập).');
  if(H['THỜI_GIAN']&&!(parseInt(v(H,'THỜI_GIAN'))>0))E.push(`Dòng ${H['THỜI_GIAN'].ln} — THỜI_GIAN phải là số phút lớn hơn 0.`);
  if(!Q.length)E.push('Chưa có câu hỏi: hãy thêm ít nhất một khối === CÂU ===.');
  const TY={'TRẮC_NGHIỆM':'s','NHIỀU_ĐÁP_ÁN':'m','ĐÚNG_SAI':'tf','TRẢ_LỜI_NGẮN':'sa'};
  const qs=Q.map((q,i)=>{
    const F=q.F,P=`Dòng ${q.ln} (câu ${i+1})`,k=TY[v(F,'DẠNG').toUpperCase()];
    if(!k){E.push(`${P} — DẠNG "${v(F,'DẠNG')}" không hợp lệ hoặc chưa hỗ trợ chấm điểm. Dùng: ${Object.keys(TY).join(', ')}.`);return null}
    const x=newQ(k),raw=v(F,'ĐÚNG'),a=(k==='sa'?raw.split(/\n|\|/):raw.toUpperCase().split(/[\s,;]+/)).map(z=>z.trim()).filter(Boolean),at=F['ĐÚNG']?.ln||q.ln;
    x.content=v(F,'HỎI');x.explanation=v(F,'GIẢI_THÍCH');
    if(!x.content)E.push(`${P} — thiếu nội dung HỎI:.`);
    if(F['ĐIỂM']&&!(parseFloat(v(F,'ĐIỂM'))>0))E.push(`Dòng ${F['ĐIỂM'].ln} — ĐIỂM phải là số lớn hơn 0.`);
    if(!a.length)E.push(`${P} — thiếu ĐÚNG: (đáp án đúng).`);
    else if(k==='sa')x.correct=a;
    else if(k==='tf'){if(a.length===1&&['ĐÚNG','SAI'].includes(a[0]))x.correct=[a[0]==='ĐÚNG'?'a':'b'];else E.push(`Dòng ${at} — ĐÚNG: chỉ nhận ĐÚNG hoặc SAI.`)}
    else{
      x.options=q.O.map(o=>({id:o.k,text:o.v.trim()}));
      const ids=x.options.map(o=>o.id);
      if(ids.length<2)E.push(`${P} — cần ít nhất 2 phương án (A., B., …).`);
      if(new Set(ids).size<ids.length)E.push(`${P} — có phương án bị trùng ký hiệu.`);
      if(x.options.some(o=>!o.text))E.push(`${P} — có phương án để trống.`);
      a.forEach(c=>{const id=c.toLowerCase();ids.includes(id)?x.correct.push(id):E.push(`Dòng ${at} — Đáp án ${c} không tồn tại. Hãy kiểm tra danh sách phương án.`)});
      if(k==='s'&&a.length>1)E.push(`Dòng ${at} — TRẮC_NGHIỆM chỉ có một đáp án đúng; hãy dùng DẠNG: NHIỀU_ĐÁP_ÁN.`);
    }
    return x});
  return{E,d:{title:v(H,'BÀI'),subject:v(H,'MÔN'),grade:v(H,'LỚP'),c:v(H,'MÔ_TẢ'),qs}};
}

  <p class="row"><button class="g" data-w="${l.id}">Xem trước</button>${ad?`<button class="g" data-e="${l.id}">Sửa</button>`:''}${l.deleted_at?(ad?B(l.id,'restore','Khôi phục'):''):
  `${l.status==='pending'?B(l.id,'ok','Duyệt')+B(l.id,'chg','Yêu cầu sửa',1)+B(l.id,'rej','Từ chối',1):''}${B(l.id,'del','Xóa',1)}${ad&&l.status==='published'?B(l.id,l.featured?'unf':'fea',l.featured?'Bỏ nổi bật':'Nổi bật',1):''}`}</p></div>`).join('')||'<p class="mut">Không có bài nào.</p>'}${pager(count,M.p)}`);
  const f=()=>{M.q=$('#q').value;M.s=$('#fs').value;M.p=0;run(mod)};

  bindPg(M,mod);
}

  const s=clean(U.q);if(s)q=q.or(`username.ilike.%${s}%,display_name.ilike.%${s}%`);if(U.r)q=q.eq('role',U.r);
  const{data,count}=await X(q.order('created_at',{ascending:false}).range(U.p*PS,U.p*PS+PS-1));
  show(`<h2>Quản lý tài khoản</h2><div class="row"><input id="q" placeholder="Tìm tài khoản" value="${esc(U.q)}"><select id="fr" aria-label="Vai trò"><option value="">Mọi vai trò</option>${Object.entries(RL).map(([k,v])=>`<option value="${k}" ${U.r===k?'selected':''}>${v}</option>`).join('')}</select><button id="sq">Tìm</button></div>
  <div class="card" style="overflow:auto"><table><tr><th>Tài khoản</th><th>Tên hiển thị</th><th>Vai trò</th><th>Khóa</th><th>Ngày tạo</th><th>Hoạt động gần nhất</th><th>Thời gian dùng</th><th></th></tr>${data.map(u=>{const me_=u.id===me.id;return `<tr><td>${esc(u.username)}</td><td>${esc(u.display_name)}</td>
  <td><select data-r="${u.id}" aria-label="Vai trò" ${me_?'disabled':''}>${Object.keys(RL).map(r=>`<option value="${r}" ${r===u.role?'selected':''}>${RL[r]}</option>`).join('')}</select></td>
  <td><input type="checkbox" data-l="${u.id}" aria-label="Khóa" ${u.locked?'checked':''} ${me_?'disabled':''}></td><td>${dt(u.created_at)}</td><td>${dtm(u.last_seen)}</td><td>${Math.round(u.active_secs/60)} phút</td><td>${me_?'':`<button class="g" data-x="${u.id}">Xóa</button>`}</td></tr>`}).join('')}</table></div>${pager(count,U.p)}`);
  const f=()=>{U.q=$('#q').value;U.r=$('#fr').value;U.p=0;run(admin)},find=id=>data.find(x=>x.id===id);
  $('#sq').onclick=f;$('#fr').onchange=f;$('#q').onkeydown=e=>e.key==='Enter'&&f();
  const set=async(u,role,lk)=>{const r=ask();if(r)try{await X(sb.rpc('admin_set',{uid:u.id,new_role:role,lk,reason:r}))}catch(e){err(e)}run(admin)};
  $$('[data-r]').forEach(s=>s.onchange=()=>set(find(s.dataset.r),s.value,find(s.dataset.r).locked));
  $$('[data-l]').forEach(c=>c.onchange=()=>set(find(c.dataset.l),find(c.dataset.l).role,c.checked));
  $$('[data-x]').forEach(b=>b.onclick=async()=>{const u=find(b.dataset.x);
    if(!confirm('Xóa tài khoản '+u.username+'? Không thể hoàn tác. Bài học của tài khoản này được giữ lại và không còn tác giả.'))return;
    const r=ask();if(!r)return;try{await X(sb.rpc('admin_delete_user',{uid:u.id,reason:r}));run(admin)}catch(e){err(e)}});
  bindPg(U,admin);
}

async function log(){
  const{data,count}=await X(sb.from('audit_log').select('created_at,action,target,reason,profiles(username)',{count:'exact'}).order('id',{ascending:false}).range(G.p*PS,G.p*PS+PS-1));
  show(`<h2>Nhật ký thao tác</h2><div class="card" style="overflow:auto"><table><tr><th>Thời gian</th><th>Người thực hiện</th><th>Thao tác</th><th>Đối tượng</th><th>Lý do</th></tr>${data.map(r=>`<tr><td>${dtm(r.created_at)}</td><td>${esc(r.profiles?.username||'(đã xóa)')}</td><td>${esc(r.action)}</td><td>${esc(r.target)}</td><td>${esc(r.reason)}</td></tr>`).join('')}</table></div>${pager(count,G.p)}`);
  bindPg(G,log);
}

/* Điều hướng bằng hash (#/home, #/mod, #/admin…); quyền thật do RLS ở backend kiểm tra */
const V={home,lb,teach,mod,admin,log},ALLOW={teach:['teacher','moderator','admin'],mod:['moderator','admin'],admin:['admin'],log:['admin']};
const route=()=>{if(!me)return;let v=location.hash.slice(2);if(!V[v]||(ALLOW[v]&&!ALLOW[v].includes(me.role)))v='home';
  $$('[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===v));run(V[v])};
const go=v=>location.hash==='#/'+v?route():(location.hash='#/'+v);
addEventListener('hashchange',route);
boot();
</script></body></html>
